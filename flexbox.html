<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Card Layout</title>

    <!-- Internal CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Flexbox container */
        .card-container {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        /* Card style */
        .card {
            background: #ffffff;
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            margin-bottom: 15px;
            color: #555;
        }

        .card button {
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .card button:hover {
            background: #0056b3;
        }

        /* Mobile view */
        @media (max-width: 768px) {
            .card-container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <h1>Our Services</h1>

    <div class="card-container">

        <div class="card">
            <h2>Web Development</h2>
            <p>Modern and responsive websites.</p>
            <button>Learn More</button>
        </div>

        <div class="card">
            <h2>AI Solutions</h2>
            <p>Smart AI & ML based systems.</p>
            <button>Learn More</button>
        </div>

        <div class="card">
            <h2>Robotics</h2>
            <p>Simulation & control using MATLAB.</p>
            <button>Learn More</button>
        </div>

    </div>

</body>

</html>
